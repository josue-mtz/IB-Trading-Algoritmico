services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"

  # Keep the existing service key so current Compose-managed installations update in place.
  spark-velas:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      - kafka
    network_mode: "service:kafka"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      TOPIC_TICKS: ${TOPIC_TICKS:-ticks}
      TOPIC_CANDLES: ${TOPIC_CANDLES:-${TOPIC_VELAS:-velas}}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}